version: "3.9"

services:
  sluxa-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sluxa-backend
    restart: unless-stopped
    ports:
      - "80:8000"
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Force SQLite to write inside the persistent volume
      - DATABASE_URL=sqlite:////data/slusha.db
    volumes:
      # Persistent volume for SQLite database (survives rebuilds)
      - sluxa-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  sluxa-data:
    driver: local
